<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-Exemplo 3: Fetch API POST com Categoria</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="functions.js" defer></script>
</head>
<body class="bg-light p-4">
  <div class="container" style="max-width: 500px;">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">Mini-Exemplo 3: Cadastro de Serviços</h5>
        <p class="text-muted small">
          Enviando dados estruturados em JSON via requisição POST.
        </p>
        <form id="formCadastro">
          <div class="mb-3">
            <label for="campoNome" class="form-label">Nome do Serviço:</label>
            <input type="text" id="campoNome" class="form-control" placeholder="Ex: Conserto de Pranchas" required>
          </div>
          <!-- Mini Desafio 2: campo de categoria -->
          <div class="mb-3">
            <label for="campoCategoria" class="form-label">Categoria:</label>
            <select id="campoCategoria" class="form-select" required>
              <option value="Tecnologia">Tecnologia</option>
              <option value="Alimentação">Alimentação</option>
              <option value="Artesanato">Artesanato</option>
              <option value="Serviços Gerais" selected>Serviços Gerais</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="campoPreco" class="form-label">Preço Base (R$):</label>
            <input type="number" id="campoPreco" class="form-control" step="0.01" placeholder="Ex: 80.00" required>
          </div>
          <button type="submit" class="btn btn-success w-100 mb-3">
            Enviar via POST para a API
          </button>
        </form>
        <div id="feedbackPost" class="alert alert-secondary d-none mb-0"></div>
      </div>
    </div>
  </div>
</body>
</html>
