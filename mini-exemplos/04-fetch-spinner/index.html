<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mini-Exemplo 4: Resiliência &amp; Spinner</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <script src="functions.js" defer></script>
</head>
<body class="bg-light p-4">
  <div class="container" style="max-width: 520px;">
    <div class="card shadow-sm">
      <div class="card-body">
        <h5 class="card-title mb-3">Mini-Exemplo 4: Resiliência &amp; Spinner</h5>
        <p class="text-muted small">
          Controle de loading states e tratamento com try...catch...finally.
        </p>
        <button id="btnVerificar"
          class="btn btn-primary w-100 d-flex justify-content-center align-items-center gap-2 mb-2">
          <span id="iconeBotao"><i class="bi bi-arrow-repeat"></i></span>
          <span id="spinnerCarregamento" class="spinner-border spinner-border-sm d-none" role="status"></span>
          <span id="textoBotao">Testar Conexão Oficial (/api/status)</span>
        </button>
        <!-- Mini Desafio 3: botão que força um erro 404 -->
        <button id="btnSimularErro"
          class="btn btn-outline-danger w-100 d-flex justify-content-center align-items-center gap-2 mb-3">
          <i class="bi bi-bug-fill"></i>
          <span>Simular Rota Inexistente (404)</span>
        </button>
        <div id="caixaAlerta" class="alert d-none mb-0" role="alert"></div>
      </div>
    </div>
  </div>
</body>
</html>
